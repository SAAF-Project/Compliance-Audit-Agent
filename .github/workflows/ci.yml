name: Public launcher checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-entrypoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test only the public launcher with synthetic helper stubs
        run: python -I -S -m unittest discover -s tests/public_entrypoint -v
